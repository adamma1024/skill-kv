[project]
name = "skillkv"
version = "0.1.0"
description = "Skill -> KV packs: precompile SKILL.md into KV caches and mount them on demand (mlx-lm)."
requires-python = ">=3.11,<3.13"
dependencies = ["mlx-lm>=0.32.2", "numpy>=2.0"]

[dependency-groups]
data = [
    "pyarrow>=26.0.0",
]
dev = ["pytest>=8"]
paper = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillkv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

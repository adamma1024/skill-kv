[project]
name = "skillkv"
version = "0.1.0"
description = "Context-free KV reuse and prompt injection: KV packs, selective recompute and attention masking for mlx-lm."
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = ["mlx-lm>=0.32.2", "numpy>=2.0"]

[dependency-groups]
data = [
    "pyarrow>=26.0.0",
]
dev = ["pytest>=8"]
paper = [
    "matplotlib>=3.11.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillkv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
